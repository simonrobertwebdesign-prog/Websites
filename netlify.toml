[build]
  publish = "site"
  # Skip the deploy (and save credits) when nothing the website uses has changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"

# Client previews and examples are never indexed by search engines.
[[headers]]
  for = "/p/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/standard-example/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/premium-example/*"
  [headers.values]
    X-Robots-Tag = "noindex"
